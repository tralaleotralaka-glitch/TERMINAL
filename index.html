<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="color-scheme" content="dark">
<meta name="description" content="Мобильный терминал: оболочка, виртуальная файловая система и справочник из 500 команд.">
<title>Терминал</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <span class="led" aria-hidden="true"></span>
      <span class="brand-name">терминал</span>
      <span class="brand-host" id="hostTag">local</span>
    </div>

    <button class="help-btn" id="helpBtn" type="button"
            aria-label="Справочник: 500 команд" aria-haspopup="dialog">
      <span class="help-q" aria-hidden="true">?</span>
      <span class="help-count" aria-hidden="true">500</span>
    </button>
  </header>

  <main class="screen" id="screen" role="log" aria-live="polite" aria-label="Вывод терминала" tabindex="-1">
    <div id="output"></div>
  </main>

  <form class="promptbar" id="promptForm" autocomplete="off">
    <label class="prompt-label" for="cmd" id="promptLabel">~ $</label>
    <input class="cmd" id="cmd" type="text" name="cmd" enterkeyhint="send"
           autocapitalize="off" autocorrect="off" spellcheck="false"
           aria-label="Команда" placeholder="введите команду">
    <button class="run" id="runBtn" type="submit" aria-label="Выполнить">↵</button>
  </form>

  <nav class="keys" id="keys" aria-label="Дополнительные клавиши">
    <button type="button" data-key="tab">Tab</button>
    <button type="button" data-key="esc">Esc</button>
    <button type="button" data-key="ctrlc">Ctrl C</button>
    <button type="button" data-key="up" aria-label="Предыдущая команда">↑</button>
    <button type="button" data-key="down" aria-label="Следующая команда">↓</button>
    <button type="button" data-key="|">|</button>
    <button type="button" data-key="/">/</button>
    <button type="button" data-key="~">~</button>
    <button type="button" data-key="-">-</button>
    <button type="button" data-key="*">&amp;</button>
  </nav>
</div>

<!-- Справочник -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-panel">
    <div class="sheet-head">
      <div class="sheet-titles">
        <h2 id="sheetTitle">Справочник команд</h2>
        <p class="sheet-sub" id="sheetCount">500 команд</p>
      </div>
      <button class="close-btn" id="closeSheet" type="button" aria-label="Закрыть справочник">✕</button>
    </div>

    <div class="searchwrap">
      <span class="search-ico" aria-hidden="true">⌕</span>
      <input class="search" id="search" type="search" placeholder="Поиск: git, сеть, архив…"
             autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Поиск по командам">
      <button class="clear-search" id="clearSearch" type="button" aria-label="Очистить поиск" hidden>✕</button>
    </div>

    <div class="chips" id="chips" role="group" aria-label="Категории"></div>

    <div class="sheet-list" id="list" tabindex="-1"></div>

    <p class="sheet-foot">Нажмите на команду — она появится в строке ввода.</p>
  </div>
</div>

<script src="commands.js"></script>
<script src="app.js"></script>
</body>
</html>
